    header .theme { font-family: var(--font-display); font-size: 2.2rem; font-weight: 600; margin: 0.7rem 0 0.3rem; color: var(--primary-light); letter-spacing: 3px; line-height: 1.05; text-transform: uppercase; background: linear-gradient(120deg, #b8941f 0%, #d4af37 20%, #f4d03f 40%, #ffd966 50%, #f4d03f 60%, #d4af37 80%, #b8941f 100%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: themeGlow 5s ease-in-out infinite, goldShineText 8s ease-in-out infinite; filter: drop-shadow(0 0 8px rgba(212,175,55,0.5)); }
    header .theme::before, header .theme::after { content: '·'; color: var(--primary); margin: 0 0.8rem; font-size: 2.4rem; vertical-align: middle; -webkit-text-fill-color: var(--primary); filter: drop-shadow(0 0 6px rgba(212,175,55,0.6)); }
    .btn-oficial { display: inline-flex; align-items: center; gap: 0.5rem; margin-top: 0.8rem; background: rgba(212,175,55,0.08); border: 1px solid var(--primary); color: var(--primary-light); padding: 0.55rem 1.3rem; border-radius: 30px; font-size: 0.9rem; font-weight: 600; text-decoration: none; transition: all 0.3s; line-height: 1.05; box-shadow: 0 0 6px rgba(212,175,55,0.15), 0 0 12px rgba(212,175,55,0.08); }
    .btn-oficial:hover { background: var(--primary); color: #000; text-decoration: none; transform: translateY(-2px); box-shadow: 0 0 12px rgba(212,175,55,0.5), 0 0 25px rgba(212,175,55,0.25); }

    .nav-sticky { background: #000; border-bottom: 1px solid var(--border-gold); padding: 0.6rem 1rem; position: sticky; top: 90px; z-index: 100; box-shadow: 0 1px 10px rgba(212,175,55,0.08); }
    .nav-sticky ul { display: flex; flex-wrap: wrap; gap: 0.3rem 1.2rem; list-style: none; justify-content: center; max-width: 1100px; margin: 0 auto; font-size: 0.85rem; line-height: 1.2; }
    .nav-sticky a { color: var(--text-muted); text-decoration: none; font-weight: 500; padding: 0.2rem 0; border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; line-height: 1.2; }
    .nav-sticky a:hover { color: var(--primary-light); border-bottom-color: var(--primary); text-shadow: 0 0 5px rgba(212,175,55,0.5); }
    .nav-sticky a.nav-oficial { color: var(--primary); font-weight: 700; text-shadow: 0 0 4px rgba(212,175,55,0.35); }
    .nav-sticky a.nav-oficial:hover { color: var(--primary-light); text-shadow: 0 0 8px rgba(212,175,55,0.6); }

    .container { max-width: 1100px; margin: 0 auto; padding: 0 1.2rem; }
    main { padding: 2rem 0 2.5rem; background: #000; }
    section { background: #000; border: 1px solid var(--border-gold); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1.5rem 1.8rem; margin-bottom: 1.2rem; transition: border-color 0.3s, box-shadow 0.3s; }

    .warning-box { background: rgba(231,76,60,0.05); border-left: 4px solid var(--accent); padding: 0.8rem 1rem; border-radius: 0 8px 8px 0; margin: 0.7rem 0; font-size: 0.95rem; color: var(--text-light); line-height: 1.25; box-shadow: 0 0 8px rgba(231,76,60,0.08); }

    .info-box { background: rgba(39,174,96,0.05); border-left: 4px solid #27ae60; padding: 0.8rem 1rem; border-radius: 0 8px 8px 0; margin: 0.7rem 0; font-size: 0.95rem; color: var(--text-light); line-height: 1.25; box-shadow: 0 0 8px rgba(39,174,96,0.08); }

    .table-responsive { overflow-x: auto; margin: 0.8rem 0; border-radius: 8px; border: 1px solid var(--border-gold); }
    table { width: 100%; border-collapse: collapse; font-size: 0.92rem; background: #000; line-height: 1.2; }
    th, td { padding: 0.6rem 0.9rem; text-align: left; border-bottom: 1px solid var(--border-gold); color: var(--text-light); line-height: 1.2; background: #000; }
    th { color: var(--primary); font-weight: 700; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.8px; border-bottom: 2px solid var(--primary); text-shadow: 0 0 4px rgba(212,175,55,0.3); }

    .btn:hover { background: var(--accent-light); color: #fff; text-decoration: none; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(231,76,60,0.3); }
    .btn-download { background: linear-gradient(110deg, #b8941f 0%, #d4af37 20%, #f4d03f 40%, #ffd966 50%, #f4d03f 60%, #d4af37 80%, #b8941f 100%); background-size: 250% 100%; color: #000; display: inline-flex; align-items: center; gap: 0.6rem; font-weight: 800; border: 1px solid #d4af37; animation: goldShine 5s ease-in-out infinite; }
    .btn-download:hover { color: #000; transform: translateY(-2px); box-shadow: 0 0 12px rgba(212,175,55,0.5), 0 0 25px rgba(212,175,55,0.25); }

    .schedule-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0.9rem; margin-top: 0.8rem; }
    .schedule-item { background: #000; border-radius: 8px; padding: 1rem 0.9rem; text-align: center; border: 1px solid var(--border-gold); border-top: 2px solid var(--primary); transition: all 0.3s; line-height: 1.2; }
    .schedule-item:hover { border-top-color: var(--primary-bright); border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 0 10px rgba(212,175,55,0.15); }
    .schedule-item .phase { font-weight: 700; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.8px; color: var(--primary); margin-bottom: 0.4rem; line-height: 1.2; text-shadow: 0 0 4px rgba(212,175,55,0.3); }
    .schedule-item .date { font-size: 0.98rem; color: #fff; font-weight: 500; line-height: 1.2; }

    .logo-box { text-align: center; padding: 1rem; background: #000; border-radius: 8px; border: 1px solid var(--border-gold); width: 100%; transition: all 0.3s; text-decoration: none; display: block; color: inherit; }

    .logo-box .logo-caption { font-size: 0.85rem; color: var(--text-muted); line-height: 1.3; }

    .logo-box .logo-caption .logo-cta { display: inline-block; margin-top: 0.5rem; color: var(--primary-light); font-size: 0.82rem; font-weight: 600; border-bottom: 1px dashed var(--primary-light); padding-bottom: 1px; }

    }
  </style>
</head>

function setLanguage(lang) {
  if (!i18n[lang]) return;

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const text = i18n[lang][key];
    if (text !== undefined) {
      el.textContent = text;
    }
  });

  document.querySelectorAll('#flags button').forEach(btn => btn.classList.remove('active'));
  const activeFlag = document.getElementById('flag-' + lang);
  if (activeFlag) activeFlag.classList.add('active');

  document.documentElement.lang = lang;
  localStorage.setItem('preferred-language', lang);
}

document.addEventListener('DOMContentLoaded', function() {
  const saved = localStorage.getItem('preferred-language') || 'es';
  setLanguage(saved);
});
